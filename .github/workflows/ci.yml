# NetFlowMonitor CI (mirrored from ignite/NetFlowMonitor).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Maven package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build shaded JAR
        run: mvn -B -DskipTests package

      - uses: actions/upload-artifact@v4
        with:
          name: netflowmonitor
          path: target/*.jar
          retention-days: 7
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: netflowmonitor
          path: release-upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "netflowmonitor build ${{ github.run_number }}"
          generate_release_notes: true
          make_latest: true
          body: |
            Automatischer Release von **NetFlowMonitor**.

            | | |
            |---|---|
            | Build | `${{ github.run_number }}` |
            | Commit | `${{ github.sha }}` |
          files: release-upload/*.jar
